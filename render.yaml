services:
  - type: web
    name: hoa-lo-smart-museum-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_BIN
        value: python3
      - key: AI_PORT
        value: "4001"
      - key: AI_TIMEOUT_MS
        value: "12000"
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: DEVICE_API_KEYS
        sync: false
      - key: REQUIRE_DEVICE_AUTH
        value: "false"
